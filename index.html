
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Mensageiro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #edf5f0;
      color: #18352a;
    }
    .card {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 35px #173b2a18;
    }
    .logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: #16875b;
      color: white;
      font-size: 30px;
    }
    h1 { text-align: center; margin: 0 0 8px; }
    .subtitle {
      text-align: center;
      color: #718078;
      margin: 0 0 25px;
    }
    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5e0d9;
      border-radius: 10px;
      font-size: 16px;
    }
    input:focus {
      outline: 2px solid #16875b55;
      border-color: #16875b;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #16875b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .secondary {
      margin-top: 10px;
      background: #e8f4ed;
      color: #16875b;
    }
    #status {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">✉</div>
    <h1>Meu Mensageiro</h1>
    <p class="subtitle">Suas conversas, em um só lugar.</p>

    <form id="auth-form">
      <label for="email">Seu e-mail</label>
      <input id="email" type="email" autocomplete="email"
        placeholder="voce@exemplo.com" required>

      <label for="password">Senha (mínimo 8 caracteres)</label>
      <input id="password" type="password"
        autocomplete="current-password" minlength="8"
        placeholder="Digite sua senha" required>

      <button type="submit">Entrar</button>
      <button class="secondary" id="signup" type="button">
        Criar minha conta
      </button>
    </form>

    <p id="status" role="status">
      Cadastro e login serão conectados na próxima etapa.
    </p>
    </main>

  <script type="module" src="app.js"></script>
</body>
</html>
